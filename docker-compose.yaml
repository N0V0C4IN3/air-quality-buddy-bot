services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: airqualitydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "57432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airqualitydb"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      
  sensor-reader:
    restart: unless-stopped
    build:
      context: .
      dockerfile: sensor-reader/Dockerfile
      args:
        TTY_GID: "20"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    devices:
       - "/dev/ttyUSB0:/dev/ttyUSB0"   # map host device into container
    privileged: true

  reporter-bot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: reporter-bot/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env

  web-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: web-api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    # Published on localhost only: the tunnel reaches it over the compose
    # network, so nothing needs to listen on the Pi's LAN address. Change to
    # "8080:8080" if you want to open it on the LAN instead.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # Outbound-only tunnel: no port forwarding, no inbound firewall rule, TLS
  # terminated by Cloudflare. Create the tunnel once in the Cloudflare
  # dashboard, point its public hostname at http://web-api:8080, and put the
  # token in .env. Comment this service out to run on the LAN only.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web-api
    profiles: ["tunnel"]

  housekeeper:
    build:
      context: .
      dockerfile: housekeeper/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq-data:
  redis-data:
