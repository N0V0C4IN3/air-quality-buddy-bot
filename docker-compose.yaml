services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: airqualitydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "57432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airqualitydb"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      
  sensor-reader:
    restart: unless-stopped
    build:
      context: .
      dockerfile: sensor-reader/Dockerfile
      args:
        TTY_GID: "20"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    devices:
       - "/dev/ttyUSB0:/dev/ttyUSB0"   # map host device into container
    privileged: true

  reporter-bot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: reporter-bot/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  housekeeper:
    build:
      context: .
      dockerfile: housekeeper/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq-data:
