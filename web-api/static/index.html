<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Air Quality</title>
  <link rel="stylesheet" href="vendor/uPlot.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="vendor/uPlot.iife.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="live-dot" aria-hidden="true"></span>
      <h1>Air Quality</h1>
    </div>
    <div class="topbar-actions">
      <button id="customize-btn" class="ghost" aria-expanded="false">Panels</button>
      <button id="theme-btn" class="ghost" title="Toggle light / dark">Theme</button>
    </div>
  </header>

  <nav class="rangebar" aria-label="Time frame">
    <div class="presets" id="presets" role="group" aria-label="Preset ranges"></div>
    <div class="custom">
      <label>From <input type="datetime-local" id="from"></label>
      <label>To <input type="datetime-local" id="to"></label>
      <button id="apply-custom">Apply</button>
      <label class="bucket">Resolution
        <select id="bucket">
          <option value="">Auto</option>
          <option value="raw">Every reading</option>
          <option value="5m">5 minutes</option>
          <option value="15m">15 minutes</option>
          <option value="1h">Hourly</option>
          <option value="6h">6 hours</option>
          <option value="1d">Daily</option>
        </select>
      </label>
    </div>
  </nav>

  <section id="customize" class="customize" hidden>
    <p class="hint">Choose what this dashboard shows. Your layout is remembered in this browser.</p>
    <div id="panel-toggles" class="toggles"></div>
  </section>

  <p id="status-line" class="status-line" role="status"></p>

  <main id="panels"></main>

  <template id="tpl-panel">
    <section class="panel">
      <header class="panel-head">
        <h2></h2>
        <span class="panel-note"></span>
      </header>
      <div class="panel-body"></div>
    </section>
  </template>

  <footer class="foot">
    <span id="foot-meta"></span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
