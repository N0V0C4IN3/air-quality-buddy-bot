<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Air Quality</title>
  <!-- The ?v= busts copies a client cached before the server sent
       Cache-Control. Bump it, and the one on every import, when a file changes shape. -->
  <link rel="stylesheet" href="styles.css?v=3">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="glow g1" aria-hidden="true"></div>
  <div class="glow g2" aria-hidden="true"></div>

  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="live" id="live-dot" aria-hidden="true"></span>
        <h1>Air Quality</h1>
      </div>
      <!-- On a phone this is the bar along the bottom of the screen, where the
           thumb is; from 900px it sits here in the header. -->
      <nav class="periods" aria-label="Period">
        <div class="seg" id="periods" role="group" aria-label="Period"></div>
      </nav>
      <div class="top-actions">
        <span class="updated" id="updated"></span>
        <button type="button" class="icon" id="theme-btn" aria-label="Switch to dark theme"></button>
      </div>
    </header>

    <main class="grid">
      <section class="card hero" aria-labelledby="now-title">
        <h2 class="tag" id="now-title">Now</h2>
        <div class="rings" id="rings"></div>
        <div class="meta" id="now-meta"></div>
      </section>

      <section class="card main" aria-labelledby="chart-title">
        <h2 class="chart-title" id="chart-title"></h2>
        <div class="controls">
          <div class="toggles" id="pollutants" role="group" aria-label="Pollutants"></div>
          <div class="detail" id="detail" role="group" aria-label="Detail"></div>
        </div>
        <div class="chart mainchart" id="chart"></div>
        <div class="caption">
          <span id="bucket-caption"></span>
          <button type="button" class="link" id="zoom-out" hidden>Zoom out</button>
        </div>
      </section>

      <section class="stats" id="stats" aria-label="Summary of the period"></section>

      <section class="card episodes-card" aria-labelledby="eps-title">
        <h2 id="eps-title"><span>Above the limit</span><span class="note" id="eps-count"></span></h2>
        <div id="episodes"></div>
      </section>
    </main>

    <footer class="foot" id="foot"></footer>
  </div>

  <script type="module" src="app.js?v=3"></script>
</body>
</html>
